<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>매뉴얼 음성 도우미</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>매뉴얼 음성 도우미</h1>
      <p class="app__subtitle">가전 사용법, 음성으로 물어보세요</p>
    </header>

    <!-- 인식된 질문 / 답변 표시 -->
    <section class="conversation" id="conversation" aria-live="polite"></section>

    <!-- 출처 매뉴얼 -->
    <section class="sources" id="sources" hidden>
      <h2>출처</h2>
      <ul id="sources-list"></ul>
    </section>

    <!-- 마이크 버튼 -->
    <footer class="app__footer">
      <button id="mic-btn" class="mic-btn" aria-label="질문 녹음">🎙️</button>
      <p id="status" class="status">버튼을 누르고 질문하세요</p>
    </footer>
  </main>

  <script src="js/app.js" type="module"></script>
</body>
</html>
