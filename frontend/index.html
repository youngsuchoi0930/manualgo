<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>매뉴얼 음성 도우미</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>매뉴얼 음성 도우미</h1>
      <p class="app__subtitle">가전 사용법, 음성으로 물어보세요</p>
    </header>

    <!-- 제품 선택: 카테고리 칩 → 모델 칩 (스코핑 검색) -->
    <section class="product">
      <div id="category-chips" class="chips" role="tablist" aria-label="제품 카테고리"></div>
      <div id="model-chips" class="chips chips--models" hidden aria-label="모델 선택"></div>
    </section>

    <!-- 첫 진입 온보딩 (첫 질문 후 사라짐) -->
    <section id="hero" class="hero">
      <div class="hero__icon">🎙️</div>
      <h2 class="hero__title">무엇이든 물어보세요</h2>
      <p class="hero__desc">제품을 고르면 더 정확해져요.<br />답변엔 근거 매뉴얼 페이지가 함께 나와요.</p>
    </section>

    <!-- 대화 -->
    <section class="conversation" id="conversation" aria-live="polite"></section>

    <!-- 추천 질문 (콜드스타트) -->
    <section id="suggestions" class="chips chips--suggest" aria-label="추천 질문"></section>

    <!-- 입력 + 음성 상태 -->
    <footer class="app__footer">
      <!-- 듣는 중 파형 + 실시간 인식 텍스트 -->
      <div id="listen-panel" class="listen" hidden>
        <div class="wave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <p id="interim" class="listen__interim">&nbsp;</p>
      </div>

      <form id="text-form" class="text-form">
        <input id="text-input" class="text-form__input" type="text"
               placeholder="또는 질문을 입력하세요" autocomplete="off" />
        <button type="submit" class="text-form__btn" aria-label="질문 보내기">➤</button>
      </form>
      <button id="mic-btn" class="mic-btn" aria-label="음성으로 질문">🎙️</button>
      <p id="status" class="status">버튼을 누르고 질문하세요</p>
    </footer>
  </main>

  <!-- 출처 페이지 미리보기 (바텀시트) -->
  <div id="page-backdrop" class="page-backdrop" hidden></div>
  <aside id="page-panel" class="page-panel" hidden aria-label="출처 페이지 미리보기">
    <header class="page-panel__head">
      <span id="page-title" class="page-panel__title"></span>
      <button id="page-close" class="page-panel__close" aria-label="닫기">✕</button>
    </header>
    <div class="page-panel__body">
      <img id="page-img" class="page-panel__img" alt="출처 매뉴얼 페이지" />
      <p id="page-loading" class="page-panel__loading">페이지 불러오는 중…</p>
    </div>
    <div id="page-srcs" class="chips page-panel__srcs"></div>
  </aside>

  <!-- 페이지 이미지 확대 (라이트박스) -->
  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" class="lightbox__img" alt="확대된 매뉴얼 페이지" />
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
